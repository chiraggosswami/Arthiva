kind = "web"
previewPath = "/"
title = "Margin Pilot"
description = "A profit-aware order, delivery, and RTO-recovery command centre for Indian D2C brands. Compare checkout and delivery journeys by expected margin, monitor order risk, and simulate interventions with seeded data."
version = "1.0.0"
id = "artifacts/margin-pilot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21278

[services.development]
run = "pnpm --filter @workspace/margin-pilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/margin-pilot", "run", "build" ]
serve = "static"
publicDir = "artifacts/margin-pilot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21278"
BASE_PATH = "/"
